<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123d32"><title>Scopa Scorekeeper</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f6f0db;background:#102d27}*{box-sizing:border-box}body{margin:0}main{max-width:760px;margin:auto;padding:20px 14px 70px}h1{font-family:Georgia,serif;font-size:2.4rem;margin:8px 0}h2{font-size:1.15rem;margin:0 0 12px}.sub{color:#c5d1bf;margin:0 0 24px}.panel{background:#1b4337;border:1px solid #3b6b55;border-radius:16px;padding:17px;margin:14px 0}label{display:block;font-size:.85rem;color:#d2ddce;margin:10px 0 5px}input,select,button{font:inherit;border-radius:9px}input,select{width:100%;padding:11px;background:#0d3028;color:white;border:1px solid #60816b}button{border:1px solid #77927c;background:#315b48;color:white;padding:10px 13px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#e5c77e;color:#1b2e25;font-weight:750;border-color:#e5c77e;width:100%;padding:15px}.danger{color:#ffd5cb}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.score{background:#113329;border:1px solid #4a765b;border-radius:12px;padding:13px;text-align:center}.score strong{display:block;font-size:2.3rem;color:#f3d68e}.score span{overflow-wrap:anywhere}.category{margin:17px 0}.category h3{font-size:1rem;margin:0 0 4px}.hint{font-size:.79rem;color:#c3d2c6;margin:0 0 8px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.choices button{font-size:.9rem;overflow-wrap:anywhere}.choices button.active{background:#e5c77e;color:#162d23;border-color:#e5c77e;font-weight:700}.scope{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #3b6652}.scope .controls{display:flex;align-items:center;gap:12px}.scope .controls button{min-width:40px}.scope b{min-width:18px;text-align:center}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{padding:12px;border-radius:9px;background:#315c47;margin:12px 0}.history{font-size:.88rem;color:#e0e7da}.history div{padding:8px 0;border-bottom:1px solid #3c6553}dialog{background:#1b4337;color:white;border:1px solid #a4b89c;border-radius:15px;padding:22px;max-width:min(420px,90vw)}dialog::backdrop{background:#000a}dialog .toolbar{justify-content:flex-end}@media(min-width:550px){.choices{grid-template-columns:repeat(3,minmax(0,1fr))}} </style></head>
<body><main><h1>♠ Scopa</h1><p class="sub">A simple Italian card game scorekeeper</p><section class="panel"><h2>Game setup</h2><div class="grid"><div><label for="count">Players</label><select id="count"><option>2</option><option>3</option><option>4</option></select></div><div><label for="target">Winning score</label><input id="target" type="number" min="1" max="999" value="11"></div></div><div id="names" class="grid"></div><div class="toolbar"><button id="reset" class="danger">New game / reset</button></div></section><section class="panel"><h2>Scoreboard <small id="roundLabel"></small></h2><div id="scores" class="scores"></div><div id="status"></div></section><section class="panel"><h2>Score this round</h2><p class="hint">Select who won each category. Tied categories award no point. Scopas are counted separately.</p><div id="categories"></div><h3>Scopas</h3><p class="hint">Add one for each sweep a player made during the round.</p><div id="scopes"></div><div class="toolbar"><button id="clear">Clear round selections</button></div><p id="preview" class="notice"></p><button id="end" class="primary">Confirm end of round</button></section><section class="panel"><h2>Round history</h2><div id="history" class="history"></div><div class="toolbar"><button id="undo">Undo last round</button></div></section></main><dialog id="confirm"><h2 id="confirmTitle">Confirm round</h2><p id="confirmText"></p><div class="toolbar"><button id="cancel">Cancel</button><button id="accept" class="primary" style="width:auto">Confirm</button></div></dialog>
<script>
(()=>{'use strict';
const KEY='scopa-scorekeeper-v1', cats=[['sette','Settebello','7 of coins — exactly one player'],['carte','Carte','Most captured cards; ties score zero'],['denari','Denari','Most coins; ties score zero'],['primiera','Primiera','Best primiera; ties score zero']];
const $=id=>document.getElementById(id);
const fresh=()=>({count:2,target:11,names:['Player 1','Player 2','Player 3','Player 4'],scores:[0,0,0,0],round:1,history:[],draft:{sette:null,carte:null,denari:null,primiera:null,scopes:[0,0,0,0]}});
let s;try{s=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(s.scores)||!s.draft||!Array.isArray(s.history))throw Error()}catch{s=fresh()}
const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const name=i=>s.names[i].trim()||`Player ${i+1}`;
const points=()=>Array.from({length:s.count},(_,i)=>cats.reduce((sum,[k])=>sum+(s.draft[k]===i?1:0),0)+(s.draft.scopes[i]||0));
const leader=()=>{const max=Math.max(...s.scores.slice(0,s.count));const winners=s.scores.slice(0,s.count).map((v,i)=>v===max?i:-1).filter(i=>i>=0);return max>=s.target&&winners.length===1?winners[0]:null};
function render(){ $('count').value=s.count;$('target').value=s.target;$('names').innerHTML='';for(let i=0;i<s.count;i++){const d=document.createElement('div'),l=document.createElement('label'),inp=document.createElement('input');l.textContent=`Player ${i+1} name`;inp.value=s.names[i];inp.maxLength=30;inp.addEventListener('input',()=>{s.names[i]=inp.value;save();renderDynamic()});d.append(l,inp);$('names').append(d)}renderDynamic()}
function renderDynamic(){ $('roundLabel').textContent=`· Round ${s.round}`;$('scores').replaceChildren();for(let i=0;i<s.count;i++){const d=document.createElement('div');d.className='score';const n=document.createElement('span'),v=document.createElement('strong');n.textContent=name(i);v.textContent=s.scores[i];d.append(n,v);$('scores').append(d)}const w=leader();$('status').textContent=w===null?'':`🏆 ${name(w)} leads with ${s.scores[w]} points and has won!`;
$('categories').replaceChildren();for(const [k,title,hint] of cats){const d=document.createElement('div');d.className='category';const h=document.createElement('h3'),p=document.createElement('p'),choices=document.createElement('div');h.textContent=title;p.textContent=hint;p.className='hint';choices.className='choices';for(let i=0;i<s.count+(k==='sette'?0:1);i++){const value=i<s.count?i:null,b=document.createElement('button');b.textContent=value===null?'Tie / nobody':name(value);b.className=s.draft[k]===value?'active':'';b.setAttribute('aria-pressed',String(s.draft[k]===value));b.onclick=()=>{s.draft[k]=value;save();renderDynamic()};choices.append(b)}d.append(h,p,choices);$('categories').append(d)}
$('scopes').replaceChildren();for(let i=0;i<s.count;i++){const d=document.createElement('div'),n=document.createElement('span'),ctrl=document.createElement('div'),minus=document.createElement('button'),plus=document.createElement('button'),v=document.createElement('b');d.className='scope';ctrl.className='controls';n.textContent=name(i);minus.textContent='−';plus.textContent='+';v.textContent=s.draft.scopes[i];minus.onclick=()=>{s.draft.scopes[i]=Math.max(0,s.draft.scopes[i]-1);save();renderDynamic()};plus.onclick=()=>{s.draft.scopes[i]++;save();renderDynamic()};ctrl.append(minus,v,plus);d.append(n,ctrl);$('scopes').append(d)}
const p=points();$('preview').textContent='This round: '+p.map((v,i)=>`${name(i)} +${v}`).join(' · ');$('history').replaceChildren();if(!s.history.length)$('history').textContent='No completed rounds yet.';for(const r of [...s.history].reverse()){const d=document.createElement('div');d.textContent=`Round ${r.round}: ${r.points.map((v,i)=>`${r.names[i]} +${v}`).join(' · ')}`;$('history').append(d)}$('undo').disabled=!s.history.length;}
$('count').onchange=()=>{if(s.history.length){$('count').value=s.count;alert('Start a new game to change the player count.');return}s.count=Number($('count').value);save();render()};$('target').onchange=()=>{s.target=Math.max(1,Math.min(999,Math.floor(Number($('target').value)||11)));save();renderDynamic()};
$('clear').onclick=()=>{s.draft=fresh().draft;save();renderDynamic()};
const dialog=$('confirm');let action=null;function ask(title,description,fn){$('confirmTitle').textContent=title;$('confirmText').textContent=description;action=fn;dialog.showModal()};$('cancel').onclick=()=>dialog.close();$('accept').onclick=()=>{dialog.close();if(action)action();action=null};
$('end').onclick=()=>{if(s.draft.sette===null){alert('Select the Settebello winner before ending the round.');return}const p=points(),totals=p.map((v,i)=>s.scores[i]+v);ask('Confirm round '+s.round+'?',p.map((v,i)=>`${name(i)}: +${v} → ${totals[i]}`).join(' | ')+' . These points will be added to the scoreboard.',()=>{s.history.push({round:s.round,points:p,names:Array.from({length:s.count},(_,i)=>name(i))});p.forEach((v,i)=>s.scores[i]+=v);s.round++;s.draft=fresh().draft;save();render();const w=leader();if(w!==null)alert(`🏆 ${name(w)} wins with ${s.scores[w]} points!`);else if(Math.max(...s.scores.slice(0,s.count))>=s.target)alert('Players are tied for the lead at or above the target. Play another round!')})};
$('undo').onclick=()=>{if(!s.history.length)return;ask('Undo last round?','This will subtract the points from the last confirmed round.',()=>{const r=s.history.pop();r.points.forEach((v,i)=>s.scores[i]-=v);s.round=r.round;save();render()})};
$('reset').onclick=()=>ask('Start a new game?','All scores and round history will be cleared. Player names and target score will stay.',()=>{const old=s;s=fresh();s.count=old.count;s.target=old.target;s.names=[...old.names];save();render()});render();
})();
</script></body></html>
